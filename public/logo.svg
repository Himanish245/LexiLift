<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main gradient for the L-shape -->
    <linearGradient id="lexi-gradient" x1="20%" y1="10%" x2="80%" y2="90%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="25%" stop-color="#0072FF" />
      <stop offset="55%" stop-color="#6000FF" />
      <stop offset="80%" stop-color="#C000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Glowing drop shadow filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0072FF" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#C000FF" flood-opacity="0.2" />
    </filter>

    <!-- White-to-transparent highlight gradient -->
    <linearGradient id="highlight-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- 1. Background shadow glow -->
  <path 
    d="M 34 20 L 34 54 Q 34 80 60 80 L 80 80" 
    stroke="url(#lexi-gradient)" 
    stroke-width="24" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#soft-glow)"
  />

  <!-- 2. Main L-shape body -->
  <path 
    d="M 34 20 L 34 54 Q 34 80 60 80 L 80 80" 
    stroke="url(#lexi-gradient)" 
    stroke-width="24" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- 3. Outer highlight (left and top edge) for 3D volume -->
  <path 
    d="M 30 20 L 30 54 Q 30 76 56 76 L 80 76" 
    stroke="url(#highlight-grad)" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- 4. Subtle inner core glow (white) -->
  <path 
    d="M 34 22 L 34 54 Q 34 80 60 80 L 78 80" 
    stroke="#FFFFFF" 
    stroke-width="1.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.45"
  />
</svg>
